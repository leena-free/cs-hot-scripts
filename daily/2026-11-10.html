<script>
const DATA = JSON.parse(document.getElementById('csdata').textContent);
const REGIONS = ['全部','华北','华南','华中','总部'];
const regionSel = document.getElementById('regionSel');
const nameSel = document.getElementById('nameSel');
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function fillRegions(){
  regionSel.innerHTML = REGIONS.map(r => '<option value="'+r+'">'+r+'</option>').join('');
}

function fillNames(){
  const r = regionSel.value;
  const list = DATA.filter(d => r === '全部' || d.region === r);
  const opts = list.map(d => '<option value="'+d.name+'">'+d.name+'　('+d.city+')</option>').join('');
  nameSel.innerHTML = '<option value="__all__">全部 ('+list.length+')</option>' + opts;
}

function render(){
  const r = regionSel.value;
  const n = nameSel.value;
  let list = DATA.filter(d => (r === '全部' || d.region === r));
  if (n !== '__all__') list = list.filter(d => d.name === n);
  countEl.innerHTML = '当前显示 <b>'+list.length+'</b> / '+DATA.length+' 条脚本';
  if (!list.length){ listEl.innerHTML = '<div class="empty">没有匹配的脚本</div>'; return; }
  listEl.innerHTML = list.map(d => {
    const ini = d.name.slice(0,1);
    return '<div class="card">'
      + '<div class="chead">'
      +   '<div class="avatar">'+ini+'</div>'
      +   '<div class="cinfo">'
      +     '<div class="cname">'+d.name+'</div>'
      +     '<div class="cmeta"><span class="badge">'+d.region+'</span><span class="badge">'+d.city+'</span></div>'
      +     '<div class="chot">'+d.topic+'</div>'
      +   '</div>'
      + '</div>'
      + '<div class="ctitle">'+d.title+'</div>'
      + '<div class="cbody">'+d.content+'</div>'
      + '<button class="btn" data-n="'+d.name+'">📋 复制脚本</button>'
      + '</div>';
  }).join('');
  listEl.querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => copyScript(b.dataset.n, b)));
}

function copyScript(name, btn){
  const d = DATA.find(x => x.name === name);
  const text = d.title + '\\n\\n' + d.content;
  const done = () => { btn.textContent = '✅ 已复制'; btn.classList.add('done'); toast('脚本已复制，粘贴去录'); setTimeout(()=>{btn.textContent='📋 复制脚本';btn.classList.remove('done');}, 1800); };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text, done));
  } else { fallback(text, done); }
}

function fallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ toast('请长按选中文本手动复制'); }
  document.body.removeChild(ta);
}

regionSel.addEventListener('change', () => { fillNames(); render(); });
nameSel.addEventListener('change', render);
fillRegions();
fillNames();
render();
</script>
</body>
