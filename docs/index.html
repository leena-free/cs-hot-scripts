和正品货源都拿不出来，好师傅凭什么跟你干。\n\n这时候得借力。\n\n联想百应，全国连锁IT品牌，29省、200多个城市、1000多家门店。\n\n货和背书这块，敢接大单。联想原装配件、品牌授权、统一报价，不用到处找货，也不怕客户问来路。\n\n西安已有不少门店加入百应，客流和营收都稳住了。\n\n想了解西安这边怎么把招牌和货源做扎实，评论区扣「百应」，我私信你。\n\n——联想百应李康，西安"}, {"name": "李琦", "region": "华南", "city": "南宁,桂林", "topic": "#换不来收入的努力大多只是逃避#", "topicLabel": "手艺与机会", "title": "【南宁】这行还有位置，但门槛在货", "content": "各位老板，今天有条热搜扎心：「换不来收入的努力，大多只是逃避」。评论区几万条，说的都是同一件事——干了十年，手艺越来越熟，钱没多一分。不是不努力，是努力的方向一直在给别人挣钱。\n\n广西的老板，南宁、桂林的年轻人，这两年往回走的多了一点，这是机会。\n\n但大厂的门槛你未必够得着。电脑维修这行不看学历，看手上功夫和客户口碑。很多人卡在第一步：没货源、没品牌、不知道怎么开始，最后又回去打工了。\n\n这时候得借力。\n\n联想百应，全国连锁IT品牌，29省、200多个城市、1000多家门店。\n\n货和背书这块，敢接大单。联想原装配件、品牌授权、统一报价，不用到处找货，也不怕客户问来路。\n\n南宁已有不少门店加入百应，客流和营收都稳住了。\n\n想了解广西这边怎么起步，评论区扣「百应」，我私信你一份开店测算。\n\n——联想百应李琦，南宁,桂林"}, {"name": "杨浩", "region": "华中", "city": "成都,宜宾", "topic": "#换不来收入的努力大多只是逃避#", "topicLabel": "手艺与机会", "title": "【成都】师傅缺的不是手艺，是名分", "content": "各位老板，今天有条热搜扎心：「换不来收入的努力，大多只是逃避」。评论区几万条，说的都是同一件事——干了十年，手艺越来越熟，钱没多一分。不是不努力，是努力的方向一直在给别人挣钱。\n\n成都、宜宾的老板，这条热搜该往自己店里想一层：技术人越来越贵，你那几个师傅值多少？\n\n师傅手艺都不差，问题是他只能修你给的活。客户是店里的、货源是店里的、招牌是店里的，他干得再好也只是打工的。这种人一旦有想法，走的时候连招呼都不打。\n\n这时候得借力。\n\n联想百应，全国连锁IT品牌，29省、200多个城市、1000多家门店。\n\n货和背书这块，敢接大单。联想原装配件、品牌授权、统一报价，不用到处找货，也不怕客户问来路。\n\n成都已有不少门店加入百应，客流和营收都稳住了。\n\n想了解成都宜宾这边怎么让师傅有奔头，评论区扣「百应」，我私信你。\n\n——联想百应杨浩，成都,宜宾"}, {"name": "王芳颖", "region": "总部", "city": "成都", "topic": "#换不来收入的努力大多只是逃避#", "topicLabel": "手艺与机会", "title": "【成都】工具到位了，人才留得住", "content": "各位老板，今天有条热搜扎心：「换不来收入的努力，大多只是逃避」。评论区几万条，说的都是同一件事——干了十年，手艺越来越熟，钱没多一分。不是不努力，是努力的方向一直在给别人挣钱。\n\n成都的老板，工具到位了，人才留得住，这句话今年在成都特别应验。\n\n门店最常犯的错，是买了设备不买工具、招了人不给方法。师傅每天在重复劳动里耗着，能力没长进，自然也留不住。\n\n这时候得借力。\n\n联想百应，全国连锁IT品牌，29省、200多个城市、1000多家门店。\n\nAI这块，直接配到店里。百应AI主机，软硬服一体。智能诊断、辅助报价、库存提醒、跟进话术，全给你接上。\n\n成都已有不少门店加入百应，客流和营收都稳住了。\n\n想看成都这边工具怎么配到位，评论区扣「百应」，我私信你。\n\n——联想百应王芳颖，成都"}, {"name": "李娜", "region": "总部", "city": "全国", "topic": "#换不来收入的努力大多只是逃避#", "topicLabel": "手艺与机会", "title": "【全国】努力不值钱，能被放大的努力才值钱", "content": "各位老板，今天有条热搜扎心：「换不来收入的努力，大多只是逃避」。评论区几万条，说的都是同一件事——干了十年，手艺越来越熟，钱没多一分。不是不努力，是努力的方向一直在给别人挣钱。\n\n全国的老板，这条热搜说穿了一件事：努力不值钱，能被放大的努力才值钱。\n\n全国的门店都在同一个困局里：卖硬件毛利越来越薄，客户越来越会比价。能撑住利润的只有服务——上门、维保、企业IT、以旧换新。可多数店只会卖货，不会卖服务。\n\n这时候得借力。\n\n联想百应，全国连锁IT品牌，29省、200多个城市、1000多家门店。\n\nAI这块，直接配到店里。百应AI主机，软硬服一体。智能诊断、辅助报价、库存提醒、跟进话术，全给你接上。\n\n全国200多个城市的门店加入百应后，客流和营收都稳住了。\n\n想了解29省200城1000家门店是怎么把服务做成生意的，评论区扣「百应」，我私信你完整资料。\n\n——联想百应李娜，全国"}]</script>
<script>
const DATA = JSON.parse(document.getElementById('csdata').textContent);
const REGIONS = ['全部','华北','华南','华中','总部'];
const regionSel = document.getElementById('regionSel');
const nameSel = document.getElementById('nameSel');
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function fillRegions(){
  regionSel.innerHTML = REGIONS.map(r => '<option value="'+r+'">'+r+'</option>').join('');
}

function fillNames(){
  const r = regionSel.value;
  const list = DATA.filter(d => r === '全部' || d.region === r);
  const opts = list.map(d => '<option value="'+d.name+'">'+d.name+'　('+d.city+')</option>').join('');
  nameSel.innerHTML = '<option value="__all__">全部 ('+list.length+')</option>' + opts;
}

function render(){
  const r = regionSel.value;
  const n = nameSel.value;
  let list = DATA.filter(d => (r === '全部' || d.region === r));
  if (n !== '__all__') list = list.filter(d => d.name === n);
  countEl.innerHTML = '当前显示 <b>'+list.length+'</b> / '+DATA.length+' 条脚本';
  if (!list.length){ listEl.innerHTML = '<div class="empty">没有匹配的脚本</div>'; return; }
  listEl.innerHTML = list.map(d => {
    const ini = d.name.slice(0,1);
    return '<div class="card">'
      + '<div class="chead">'
      +   '<div class="avatar">'+ini+'</div>'
      +   '<div class="cinfo">'
      +     '<div class="cname">'+d.name+'</div>'
      +     '<div class="cmeta"><span class="badge">'+d.region+'</span><span class="badge">'+d.city+'</span></div>'
      +     '<div class="chot">'+d.topic+'</div>'
      +   '</div>'
      + '</div>'
      + '<div class="ctitle">'+d.title+'</div>'
      + '<div class="cbody">'+d.content+'</div>'
      + '<button class="btn" data-n="'+d.name+'">📋 复制脚本</button>'
      + '</div>';
  }).join('');
  listEl.querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => copyScript(b.dataset.n, b)));
}

function copyScript(name, btn){
  const d = DATA.find(x => x.name === name);
  const text = d.title + '\n\n' + d.content;
  const done = () => { btn.textContent = '✅ 已复制'; btn.classList.add('done'); toast('脚本已复制，粘贴去录'); setTimeout(()=>{btn.textContent='📋 复制脚本';btn.classList.remove('done');}, 1800); };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text, done));
  } else { fallback(text, done); }
}

function fallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ toast('请长按选中文本手动复制'); }
  document.body.removeChild(ta);
}

regionSel.addEventListener('change', () => { fillNames(); render(); });
nameSel.addEventListener('change', render);
fillRegions();
fillNames();
render();
</script>
</body>
