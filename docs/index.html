店是怎么把服务做成生意的，评论区扣「百应」，我私信你完整资料。\n\n——联想百应李娜，全国"}, {"name": "高振杰", "region": "华南", "city": "华南大区", "topic": "#丈母娘也开始抢AI人了#", "topicLabel": "技术人值钱", "title": "【华南】AI人被抢，说明手艺开始值钱了", "content": "各位老板，今天这条热搜有点魔幻：湾区婚介把AI公司员工排进择偶第一梯队，丈母娘开始抢AI人了。段子背后是句实话——有技术的人，正在被重新定价。\n\n华南各位老板，今天这条热搜挺魔幻：湾区的婚介把AI公司员工排进择偶第一梯队，丈母娘开始抢人了。\n\n听着像段子，说的是真事——有技术的人正在变贵。你店里最扎心的一幕：最能干的师傅干满三年，工资涨不过房租，客户还被他自己带走开店了。你想留人，拿什么留？\n\n这时候得借力。联想百应，全国连锁IT服务品牌，29省、200多个城市、1000多家门店。\n\n货和背书这块，敢接大单。联想原装配件、品牌授权、统一报价，不用到处找货，也不怕客户问来路。\n\n华南已有不少门店加入百应，客流和营收都稳住了。\n\n想了解华南这边怎么把师傅留住，评论区扣「百应」，我私信你。\n\n——联想百应高振杰，华南大区"}, {"name": "何建岳", "region": "华中", "city": "兰州,银川，乌鲁木齐，西宁", "topic": "#丈母娘也开始抢AI人了#", "topicLabel": "技术人值钱", "title": "【兰州】年轻人往外走，你得给他留下的理由", "content": "各位老板，今天这条热搜有点魔幻：湾区婚介把AI公司员工排进择偶第一梯队，丈母娘开始抢AI人了。段子背后是句实话——有技术的人，正在被重新定价。\n\n兰州、银川、乌鲁木齐、西宁的老板，西北的年轻人一毕业就往东南飞。今天这条热搜讲的是同一件事的另一面。\n\n不是西北留不住人，是西北的店给不出「往上走」的路。师傅带徒弟、口头传手艺、干多干少一个样——年轻人看不到三年后的自己，当然要走。\n\n这时候得借力。联想百应，全国连锁IT服务品牌，29省、200多个城市、1000多家门店。\n\n货和背书这块，敢接大单。联想原装配件、品牌授权、统一报价，不用到处找货，也不怕客户问来路。\n\n兰州已有不少门店加入百应，客流和营收都稳住了。\n\n想了解西北这边怎么给年轻人一条路，评论区扣「百应」，我私信你。\n\n——联想百应何建岳，兰州,银川，乌鲁木齐，西宁"}, {"name": "孙浩", "region": "华北", "city": "济南,淄博,潍坊", "topic": "#丈母娘也开始抢AI人了#", "topicLabel": "技术人值钱", "title": "【济南】技术人值钱了，山东的师傅也该涨身价", "content": "各位老板，今天这条热搜有点魔幻：湾区婚介把AI公司员工排进择偶第一梯队，丈母娘开始抢AI人了。段子背后是句实话——有技术的人，正在被重新定价。\n\n山东的老板，济南、淄博、潍坊这三地，最不缺的就是肯干活的人。缺的是让手艺人值钱的地方。\n\n山东门店的通病是低价内卷：一条街三家店，报价一个比一个低，最后谁都不挣钱，师傅工资也上不去。价格战打到底，人一定留不住。\n\n这时候得借力。联想百应，全国连锁IT服务品牌，29省、200多个城市、1000多家门店。\n\n货和背书这块，敢接大单。联想原装配件、品牌授权、统一报价，不用到处找货，也不怕客户问来路。\n\n济南已有不少门店加入百应，客流和营收都稳住了。\n\n想了解山东这边怎么跳出价格战，评论区扣「百应」，我私信你。\n\n——联想百应孙浩，济南,淄博,潍坊"}, {"name": "李康", "region": "华北", "city": "西安", "topic": "#丈母娘也开始抢AI人了#", "topicLabel": "技术人值钱", "title": "【西安】高校一批批送人，你店里为什么还空着岗", "content": "各位老板，今天这条热搜有点魔幻：湾区婚介把AI公司员工排进择偶第一梯队，丈母娘开始抢AI人了。段子背后是句实话——有技术的人，正在被重新定价。\n\n西安的老板，这座城市每年毕业几十万大学生，可你招个靠谱的师傅还是难。\n\n好苗子毕业就奔大厂和研究所去了，留下来的，你给的是「先干着看看」。西安客户认品牌、认原装件，你要是连正经招牌和正品货源都拿不出来，好师傅凭什么跟你干？\n\n这时候得借力。联想百应，全国连锁IT服务品牌，29省、200多个城市、1000多家门店。\n\n货和背书这块，敢接大单。联想原装配件、品牌授权、统一报价，不用到处找货，也不怕客户问来路。\n\n西安已有不少门店加入百应，客流和营收都稳住了。\n\n想了解西安这边怎么把招牌和货源做扎实，评论区扣「百应」，我私信你。\n\n——联想百应李康，西安"}, {"name": "李琦", "region": "华南", "city": "南宁,桂林", "topic": "#丈母娘也开始抢AI人了#", "topicLabel": "技术人值钱", "title": "【南宁】这行还有位置，但门槛在变", "content": "各位老板，今天这条热搜有点魔幻：湾区婚介把AI公司员工排进择偶第一梯队，丈母娘开始抢AI人了。段子背后是句实话——有技术的人，正在被重新定价。\n\n南宁、桂林的年轻朋友，这条热搜你该看看——它证明技术这碗饭，一直有人抢着吃。\n\n但大厂的门槛你未必够得着。电脑维修这行不看学历，看手上功夫和客户口碑。很多人卡在第一步：没货源、没品牌、不知道怎么开始，最后又回去打工了。\n\n这时候得借力。联想百应，全国连锁IT服务品牌，29省、200多个城市、1000多家门店。\n\n货和背书这块，敢接大单。联想原装配件、品牌授权、统一报价，不用到处找货，也不怕客户问来路。\n\n南宁已有不少门店加入百应，客流和营收都稳住了。\n\n想了解广西这边怎么起步，评论区扣「百应」，我私信你一份开店测算。\n\n——联想百应李琦，南宁,桂林"}, {"name": "杨浩", "region": "华中", "city": "成都,宜宾", "topic": "#丈母娘也开始抢AI人了#", "topicLabel": "技术人值钱", "title": "【成都】师傅缺的不是手艺，是奔头", "content": "各位老板，今天这条热搜有点魔幻：湾区婚介把AI公司员工排进择偶第一梯队，丈母娘开始抢AI人了。段子背后是句实话——有技术的人，正在被重新定价。\n\n成都的老板，这条热搜该往自己店里想一层：技术人才越来越贵，你那几个师傅值多少？\n\n成都、宜宾的店，师傅手艺都不差，问题是他只能修你给的单。客户是店里的、货源是店里的、招牌是店里的，他干得再好也只是打工的。这种人一旦有了想法，走的时候连招呼都不打。\n\n这时候得借力。联想百应，全国连锁IT服务品牌，29省、200多个城市、1000多家门店。\n\n货和背书这块，敢接大单。联想原装配件、品牌授权、统一报价，不用到处找货，也不怕客户问来路。\n\n成都已有不少门店加入百应，客流和营收都稳住了。\n\n想了解成都宜宾这边怎么让师傅有奔头，评论区扣「百应」，我私信你。\n\n——联想百应杨浩，成都,宜宾"}, {"name": "韦娇月", "region": "华南", "city": "安徽", "topic": "#丈母娘也开始抢AI人了#", "topicLabel": "技术人值钱", "title": "【安徽】一个人开店，怎么干出三个人的活", "content": "各位老板，今天这条热搜有点魔幻：湾区婚介把AI公司员工排进择偶第一梯队，丈母娘开始抢AI人了。段子背后是句实话——有技术的人，正在被重新定价。\n\n安徽的年轻老板，一个人守店最怕什么？不是没客户，是客户来了你腾不出手。\n\n人在修机器，电话响不停，微信里还有五个客户问价。AI这波最实在的价值不是概念，是替你回话、替你报价、替你记事。你腾出来的那两个小时，就是多接两单的钱。\n\n这时候得借力。联想百应，全国连锁IT服务品牌，29省、200多个城市、1000多家门店。\n\nAI这块，直接配到店里。百应AI主机，软硬服一体。智能诊断、辅助报价、库存提醒、跟进话术，全给你接上。\n\n安徽已有不少门店加入百应，客流和营收都稳住了。\n\n想了解安徽这边怎么用工具补人手，评论区扣「百应」，我私信你。\n\n——联想百应韦娇月，安徽"}, {"name": "王芳颖", "region": "总部", "city": "成都", "topic": "#丈母娘也开始抢AI人了#", "topicLabel": "技术人值钱", "title": "【成都】工具到位了，人才留得住", "content": "各位老板，今天这条热搜有点魔幻：湾区婚介把AI公司员工排进择偶第一梯队，丈母娘开始抢AI人了。段子背后是句实话——有技术的人，正在被重新定价。\n\n成都的老板，AI人被抢这条热搜说明一件事：工具正在把人的价值重新分层。会用工具的人，一个人顶三个。\n\n成都门店最常犯的错，是买了设备不买工具、招了人不给方法。师傅每天在重复劳动里耗着，能力没长进，自然也留不住。工具到位，人才能腾出手做值钱的事。\n\n这时候得借力。联想百应，全国连锁IT服务品牌，29省、200多个城市、1000多家门店。\n\nAI这块，直接配到店里。百应AI主机，软硬服一体。智能诊断、辅助报价、库存提醒、跟进话术，全给你接上。\n\n成都已有不少门店加入百应，客流和营收都稳住了。\n\n想看成都这边工具怎么配到位，评论区扣「百应」，我私信你。\n\n——联想百应王芳颖，成都"}]</script>
<script>
const DATA = JSON.parse(document.getElementById('csdata').textContent);
const REGIONS = ['全部','华北','华南','华中','总部'];
const regionSel = document.getElementById('regionSel');
const nameSel = document.getElementById('nameSel');
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function fillRegions(){
  regionSel.innerHTML = REGIONS.map(r => '<option value="'+r+'">'+r+'</option>').join('');
}

function fillNames(){
  const r = regionSel.value;
  const list = DATA.filter(d => r === '全部' || d.region === r);
  const opts = list.map(d => '<option value="'+d.name+'">'+d.name+'　('+d.city+')</option>').join('');
  nameSel.innerHTML = '<option value="__all__">全部 ('+list.length+')</option>' + opts;
}

function render(){
  const r = regionSel.value;
  const n = nameSel.value;
  let list = DATA.filter(d => (r === '全部' || d.region === r));
  if (n !== '__all__') list = list.filter(d => d.name === n);
  countEl.innerHTML = '当前显示 <b>'+list.length+'</b> / '+DATA.length+' 条脚本';
  if (!list.length){ listEl.innerHTML = '<div class="empty">没有匹配的脚本</div>'; return; }
  listEl.innerHTML = list.map(d => {
    const ini = d.name.slice(0,1);
    return '<div class="card">'
      + '<div class="chead">'
      +   '<div class="avatar">'+ini+'</div>'
      +   '<div class="cinfo">'
      +     '<div class="cname">'+d.name+'</div>'
      +     '<div class="cmeta"><span class="badge">'+d.region+'</span><span class="badge">'+d.city+'</span></div>'
      +     '<div class="chot">'+d.topic+'</div>'
      +   '</div>'
      + '</div>'
      + '<div class="ctitle">'+d.title+'</div>'
      + '<div class="cbody">'+d.content+'</div>'
      + '<button class="btn" data-n="'+d.name+'">📋 复制脚本</button>'
      + '</div>';
  }).join('');
  listEl.querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => copyScript(b.dataset.n, b)));
}

function copyScript(name, btn){
  const d = DATA.find(x => x.name === name);
  const text = d.title + '\n\n' + d.content;
  const done = () => { btn.textContent = '✅ 已复制'; btn.classList.add('done'); toast('脚本已复制，粘贴去录'); setTimeout(()=>{btn.textContent='📋 复制脚本';btn.classList.remove('done');}, 1800); };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text, done));
  } else { fallback(text, done); }
}

function fallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ toast('请长按选中文本手动复制'); }
  document.body.removeChild(ta);
}

regionSel.addEventListener('change', () => { fillNames(); render(); });
nameSel.addEventListener('change', render);
fillRegions();
fillNames();
render();
</script>
</body>
